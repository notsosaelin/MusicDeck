[package]
name = "musicdeck-net"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MusicDeck's internet link between paired devices: iroh (QUIC, hole punching, relays), JSON lines to Python"
publish = false

[dependencies]
# no default features: they include the port mapper (UPnP, NAT-PMP, PCP), which MusicDeck never uses
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
iroh-mainline-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
miniz_oxide = { version = "0.8", features = ["with-alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
