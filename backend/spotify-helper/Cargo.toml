[package]
name = "spotify-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MusicDeck's Spotify audio helper: librespot session + decrypted audio over loopback HTTP"
publish = false

[dependencies]
# Same engine as Spotifast. rustls with bundled web PKI roots (ring crypto): no system OpenSSL or
# certificate store, so the binary is fully static and runs on any distro.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-audio = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8"
# same versions librespot itself builds with
protobuf = "3"
http = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# unwind (not abort): a panic in one request thread must not take audio down for every other
panic = "unwind"
